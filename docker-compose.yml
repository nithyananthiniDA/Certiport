
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: certiport-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: certiport
      POSTGRES_USER: certiport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certiport_demo_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiport -d certiport"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: certiport-api
    restart: unless-stopped

    environment:
      APP_NAME: examate-rag
      ENVIRONMENT: docker
      DATABASE_URL: postgresql://certiport:${POSTGRES_PASSWORD:-certiport_demo_password}@db:5432/certiport
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      CERTIPORT_DATA_DIR: data/processed

    ports:
      - "8000:8000"

    volumes:
      - ./data/processed:/app/data/processed:ro

    depends_on:
      db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
